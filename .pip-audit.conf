# pip-audit configuration for CI-safe vulnerability scanning

# Set severity threshold
# Only report vulnerabilities with severity >= medium
severity = 'medium'

# Ignore specific vulnerabilities with false positives
# Format: package_name==version:CVE-ID
ignore = [
    # Example: urllib3==2.0.0:GHSA-v7x6-8m3q-jj8q
]

# Output format
format = 'json'

# Exit code configuration
# Exit with 0 even if vulnerabilities are found (for reporting purposes)
# CI pipeline will handle the actual failure based on severity
exit-code = 0
