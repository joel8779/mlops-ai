name: ml-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m compileall apps/api/app/ml apps/api/app/benchmarks
