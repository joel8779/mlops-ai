name: security-ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
      - name: Bandit
        run: bandit -r apps/api/app -x apps/api/app/tests -c .bandit
      - name: pip-audit
        run: pip-audit -r apps/api/requirements.txt --format json --output pip-audit.json --config .pip-audit.conf || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: ignore

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm audit --audit-level=moderate --production || true

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.57.1 fs \
            --severity HIGH,CRITICAL --exit-code 0 /workspace --ignorefile .trivyignore
