name: backend-ci

on:
  push:
    paths:
      - "apps/api/**"
      - "scripts/ci/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "scripts/ci/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

env:
  ENVIRONMENT: test
  LLM_PROVIDER: disabled
  GEMINI_API_KEY: test-gemini-key
  JWT_SECRET_KEY: ci-test-secret-key-change-me
  DATABASE_URL: postgresql+asyncpg://resume:resume@localhost:5432/resume_ai
  SYNC_DATABASE_URL: postgresql+psycopg://resume:resume@localhost:5432/resume_ai
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/1
  CELERY_RESULT_BACKEND: redis://localhost:6379/2
  QDRANT_URL: http://localhost:6333
  S3_ENDPOINT_URL: http://localhost:9000
  OTEL_TRACES_EXPORTER: none
  PYTHONPATH: apps/api

jobs:
  test:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
            apps/api/constraints.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r apps/api/requirements-dev.txt

      - name: Static checks
        working-directory: apps/api
        run: |
          python -m compileall app
          python -m ruff check app

      - name: Dependency sync validation
        run: python scripts/ci/sync_dependencies.py

      - name: Runtime verification
        run: |
          python scripts/ci/verify_runtime.py
          python scripts/ci/verify_routes.py
          python scripts/ci/verify_observability.py
          python scripts/ci/verify_workers.py

      - name: Unit tests
        working-directory: apps/api
        run: python -m pytest -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage-${{ matrix.python-version }}
          path: apps/api/coverage.xml
          if-no-files-found: ignore
