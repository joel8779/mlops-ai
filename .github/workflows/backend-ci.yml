name: backend-ci

on:
  push:
    paths: ["apps/api/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["apps/api/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r apps/api/requirements-dev.txt
      - run: ruff check apps/api/app
      - run: pytest apps/api/app/tests --cov=apps/api/app --cov-fail-under=80
      - run: docker build apps/api -t resume-intelligence-api:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: resume-intelligence-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
