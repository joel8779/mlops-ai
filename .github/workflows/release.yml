name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "$VERSION" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          cd apps/api
          python -m compileall app
          alembic heads

  build-artifacts:
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build apps/api -t resume-intelligence-api:${{ needs.validate-release.outputs.version }}
      - name: Export image artifact
        run: docker save resume-intelligence-api:${{ needs.validate-release.outputs.version }} -o resume-intelligence-api.tar
      - uses: actions/upload-artifact@v5
        with:
          name: resume-intelligence-api-${{ needs.validate-release.outputs.version }}
          path: resume-intelligence-api.tar

  github-release:
    runs-on: ubuntu-latest
    needs: [validate-release, build-artifacts]
    steps:
      - uses: actions/checkout@v6
      - name: Generate changelog
        run: |
          git log --pretty=format:"- %s (%h)" "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~20)"..HEAD > CHANGELOG_RELEASE.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n resume-intelligence-api-${{ needs.validate-release.outputs.version }}
          gh release create "${{ needs.validate-release.outputs.version }}" resume-intelligence-api.tar \
            --title "${{ needs.validate-release.outputs.version }}" \
            --notes-file CHANGELOG_RELEASE.md
