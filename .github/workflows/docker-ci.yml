name: docker-ci

on:
  push:
    paths:
      - "apps/api/Dockerfile"
      - "apps/api/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    paths:
      - "apps/api/Dockerfile"
      - "apps/api/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-ci.yml"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate compose files
        run: |
          # Create minimal .env for CI validation
          cat > .env << 'EOF'
          ENVIRONMENT=test
          DEBUG=true
          LOG_JSON=false
          DATABASE_URL=postgresql+asyncpg://resume:resume@localhost:5432/resume_ai
          SYNC_DATABASE_URL=postgresql+psycopg://resume:resume@localhost:5432/resume_ai
          REDIS_URL=redis://localhost:6379/0
          CELERY_BROKER_URL=redis://localhost:6379/1
          CELERY_RESULT_BACKEND=redis://localhost:6379/2
          QDRANT_URL=http://localhost:6333
          S3_ENDPOINT_URL=http://localhost:9000
          EOF
          docker compose -f docker-compose.yml config --quiet

      - name: Build API image
        run: docker build apps/api -t resume-intelligence-api:${{ github.sha }}

      - name: Smoke test image
        run: docker run --user root --rm resume-intelligence-api:${{ github.sha }} python -m compileall /app/app

      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL --exit-code 0 resume-intelligence-api:${{ github.sha }}
