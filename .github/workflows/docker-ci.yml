name: docker-ci

on:
  push:
    paths:
      - "apps/api/Dockerfile"
      - "apps/api/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    paths:
      - "apps/api/Dockerfile"
      - "apps/api/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-ci.yml"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet

      - name: Build API image
        run: docker build apps/api -t resume-intelligence-api:${{ github.sha }}

      - name: Smoke test image
        run: docker run --rm resume-intelligence-api:${{ github.sha }} python -m compileall app

      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL --exit-code 0 resume-intelligence-api:${{ github.sha }} --ignorefile .trivyignore
