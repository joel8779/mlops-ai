[project]
name = "resume-intelligence-api"
version = "0.1.0"
description = "FastAPI backend for the AI Resume Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.1",
  "asyncpg>=0.29.0",
  "boto3>=1.34.0",
  "celery[redis]>=5.3.6",
  "email-validator>=2.1.1",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pillow>=10.3.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "pypdf>=4.2.0",
  "python-docx>=1.1.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "pytesseract>=0.3.10",
  "redis>=5.0.4",
  "sqlalchemy[asyncio]>=2.0.29",
  "structlog>=24.1.0",
  "uvicorn[standard]>=0.29.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
