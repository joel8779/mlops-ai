apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-intelligence-api
  namespace: default
  labels:
    app: resume-intelligence-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resume-intelligence-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: resume-intelligence-api
        version: v1
    spec:
      containers:
      - name: api
        image: resume-intelligence-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: resume-intelligence-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: resume-intelligence-secrets
              key: redis-url
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: resume-intelligence-secrets
              key: gemini-api-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: resume-intelligence-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: resume-intelligence-api
  namespace: default
  labels:
    app: resume-intelligence-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: resume-intelligence-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resume-intelligence-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-intelligence-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
