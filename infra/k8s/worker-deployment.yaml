apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-intelligence-worker
  namespace: default
  labels:
    app: resume-intelligence-worker
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-intelligence-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: resume-intelligence-worker
        version: v1
    spec:
      containers:
      - name: worker
        image: resume-intelligence-api:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=4"]
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: resume-intelligence-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: resume-intelligence-secrets
              key: redis-url
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: resume-intelligence-secrets
              key: celery-broker-url
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: resume-intelligence-secrets
              key: gemini-api-key
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resume-intelligence-worker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-intelligence-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
