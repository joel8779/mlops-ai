apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-intelligence
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.resume-intelligence.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-api
                port:
                  number: 80
