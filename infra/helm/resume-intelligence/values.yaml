image:
  repository: resume-intelligence-api
  tag: latest
  pullPolicy: Always

api:
  replicas: 3
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

worker:
  replicas: 2
  resources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 4000m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  host: api.resume-intelligence.example.com
  tls:
    enabled: true
    secretName: resume-intelligence-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"

database:
  host: postgres
  port: 5432
  name: resume_ai
  user: resume
  existingSecret: resume-intelligence-secrets

redis:
  host: redis
  port: 6379
  existingSecret: resume-intelligence-secrets

qdrant:
  host: qdrant
  port: 6333
  collection: candidate_embeddings

gemini:
  model: gemini-2.5-flash
  existingSecret: resume-intelligence-secrets

monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
