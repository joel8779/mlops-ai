groups:
  - name: ai-platform-slos
    rules:
      - alert: HighLLMLatency
        expr: histogram_quantile(0.95, sum(rate(llm_request_latency_ms_bucket[5m])) by (le, model, feature)) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LLM p95 latency is above 10 seconds
          description: "Gemini latency for {{ $labels.model }} / {{ $labels.feature }} is above the SLO."

      - alert: AgentExecutionFailures
        expr: increase(agent_execution_failures_total[10m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Autonomous agent workflow failures detected
          description: "Workflow step {{ $labels.workflow_step }} is failing with {{ $labels.error_type }}."

      - alert: RetrievalLatencyRegression
        expr: histogram_quantile(0.95, sum(rate(retrieval_topk_latency_ms_bucket[5m])) by (le, strategy)) > 1500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Retrieval latency regression
          description: "Top-k retrieval strategy {{ $labels.strategy }} exceeded 1.5 seconds p95."

      - alert: RecommendationLatencyRegression
        expr: histogram_quantile(0.95, sum(rate(recommendation_generation_time_ms_bucket[5m])) by (le, strategy)) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Recommendation generation latency regression
          description: "Recommendation strategy {{ $labels.strategy }} exceeded 2 seconds p95."

      - alert: RedisStreamConsumerLag
        expr: redis_stream_consumer_lag > 1000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Redis stream consumer lag is high
          description: "Stream {{ $labels.stream }} group {{ $labels.consumer_group }} has high pending lag."

      - alert: WebSocketConnectionSpike
        expr: sum(websocket_active_connections) > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WebSocket active connection spike
          description: Active websocket connections crossed the current operating threshold.
